# Each lane owns a package; apps compose their public exports.
packages:
  - apps/*
  - packages/*
allowBuilds:
  nx: true
minimumReleaseAgeExclude:
  - "@nx/nx-darwin-arm64@24.0.2"
  - "@nx/nx-darwin-x64@24.0.2"
  - "@nx/nx-freebsd-x64@24.0.2"
  - "@nx/nx-linux-arm-gnueabihf@24.0.2"
  - "@nx/nx-linux-arm64-gnu@24.0.2"
  - "@nx/nx-linux-arm64-musl@24.0.2"
  - "@nx/nx-linux-x64-gnu@24.0.2"
  - "@nx/nx-linux-x64-musl@24.0.2"
  - "@nx/nx-win32-arm64-msvc@24.0.2"
  - "@nx/nx-win32-x64-msvc@24.0.2"
  - "@tanstack/query-core@5.105.0"
  - "@tanstack/react-query@5.105.0"
  - nx@24.0.2
