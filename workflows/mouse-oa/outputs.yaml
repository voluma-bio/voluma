# Every output a run of the mouse OA workflow can produce, in the agent model's format
# (packages/contracts/src/output-catalog.ts).
#
# Bones are overlays on `scan`: each is one label of the `bone-labels` map, which is reported once.
# Values are the outputs a researcher can select; their `on` and `context` overlays are shown
# with them.

# Files and bases

- id: header
  kind: file
  name: Scan header
  summary: "The scan's voxel size, dimensions and the evidence for its density calibration, as read from the scan files."
  description:
    "hu.json from scan-intake: voxel spacing (z, y, x, mm), shape, calibration evidence and
    the grid id every later step uses"
  mediaType: application/json
  expect:
    - The spacing and size come from the files themselves, with the file or header each came from.

- id: frame
  kind: file
  name: Joint frame
  summary: "The knee's rough orientation: the shaft axes, the bending plane, and a slice through the joint."
  description:
    "frame.json from orient-joint: intake's rough orientation of the knee (the shaft axes,
    the bending plane and the keyframe the oriented stack is cut on)"
  mediaType: application/json
  expect:
    - The keyframe cuts the femur and the tibia through the joint, and the patella when it is in the
      field, and says which bone is on top, as
      /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (intake) describes.

- id: scan
  kind: base
  name: Scan
  summary: "The micro-CT scan in Hounsfield units, with the holder, padding and debris removed."
  description: hu.npy from scan-intake, in HU, with the affine from hu.json
  planes: { XY: axial, XZ: sagittal, YZ: coronal }
  expect:
    - Holder, padding and debris are set to air under a removal mask on the scan grid, and the scan
      is unchanged outside it; a piece that may be anatomy stays, with a To check item. Both are
      shown on a 3D view of the cleaned scan and one of the mask.
    - "An earlier version reported straight after conversion, with the To check item 'Not yet cleaned: holder and
      debris still in the field', is a preview for the researcher: no step starts from it or cites it in madeFrom."

- id: tibia-grid
  kind: base
  name: Tibia long-axis grid
  summary: "The tibia, resampled so its long axis runs vertically, the lab's convention; the tibial regions sit on it."
  description: the tibia resampled onto a grid whose z (W, joint end toward the shaft) is the tibia's fitted long axis, so the shaft is vertical in the coronal and sagittal panes, the lab's convention; the regions and surfaces below sit on it
  from: scan
  planes: { XY: axial, XZ: coronal, YZ: sagittal }
  expect:
    - +U medial and +V anterior (tibia_frame.py's medial_side and anterior_side, from the fibula and the
      patella), confirmed on the frame's QC montage.

- id: scan-notes
  kind: file
  name: Scan notes
  summary: "Notes on the scan and what is in the field of view, taken from the files supplied with it."
  description: "scan-notes.md from scan-intake: the researcher's account of the field"
  mediaType: text/markdown
  expect:
    - Every fact names the file in /inputs it came from; a heading with nothing under it says
      "nothing stated".

- id: scan-settings
  kind: file
  name: Scan settings
  summary: "This scan's display window and bone segmentation threshold, chosen from its density histogram."
  description:
    "scan-settings.json from scan-intake: this scan's display window and segmentation threshold,
    chosen from its histogram, which every later render and mask uses"
  mediaType: application/json
  expect:
    - The threshold's outline follows the cortex edge and keeps thin trabeculae, and leaves out soft
      tissue and the growth plate's cartilage, on zoomed slices through the joint and the
      metaphysis rendered in the chosen window.

- id: bone-pieces
  kind: file
  name: Bone pieces
  summary: "Each separate piece of bone in the cleaned scan, named as a bone of the knee or marked unknown."
  description: "pieces.md from intake: each bone piece of the cleaned scan, named"
  mediaType: text/markdown
  expect:
    - Each piece from `components.py` is named as a bone of the knee, or unknown with a To check
      item.

- id: small-structures
  kind: file
  name: Small structures
  summary: "Each small structure around the joint (labels 5 to 12): labelled, absent, or left to check."
  description: "small-structures.md from segmentation: an account of each of labels 5 to 12"
  mediaType: text/markdown
  expect:
    - "Accounts for each of labels 5 to 12
      (/workflow/workflows/mouse-oa/skills/mouse-oa/references/anatomy.md): labelled, absent with
      the reason and the view it rests on, or unresolved with a To check item."

# Overlays
- id: removal-mask
  kind: overlay
  name: Removal mask
  summary: "What was removed from the scan: the holder, padding and debris."
  description: "what intake set to air in the scan: holder, padding and debris"
  base: scan
  shape: mask

- id: bone-labels
  kind: overlay
  name: Bone labels
  summary: "The segmentation: each bone and small structure of the knee, with its own label."
  description: labels.npy on the scan grid; the bones below are values in it
  base: scan
  shape: labels
  expect:
    - Every label is one structure, and every piece present is labelled or raised as a To check
      item, checked on the 3D sheet and the label checks, as
      /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (segmentation) describes.
    - The file reported is the one finish_labels.py wrote, with its check record cited as evidence;
      each flag the record accepts names the To check item that holds it, or why it is no fault.
    - "An earlier version reported straight after the SAM merge, with the To check item 'Not yet checked:
      finish_labels.py pending', is a preview for the researcher: no step starts from it or cites it in madeFrom."

- id: disagreement
  kind: overlay
  name: Segmentation disagreement
  summary: "Where this segmentation and an independent classic segmentation disagree: the places to check."
  description:
    "disagreement.npy from disagree.py on the scan grid: the regions where your labels and
    the classic method's differ, for To check items to point at"
  base: scan
  shape: labels

- id: femur
  kind: overlay
  name: Femur
  summary: "The femur, as segmented from the scan."
  base: scan
  label: { of: bone-labels, value: 1 }

- id: tibia
  kind: overlay
  name: Tibia
  summary: "The tibia, as segmented from the scan."
  base: scan
  label: { of: bone-labels, value: 2 }

- id: patella
  kind: overlay
  name: Patella
  summary: "The patella, as segmented from the scan."
  base: scan
  label: { of: bone-labels, value: 3 }

- id: fibula
  kind: overlay
  name: Fibula
  summary: "The fibula, as segmented from the scan."
  base: scan
  label: { of: bone-labels, value: 4 }

- id: medial-meniscus-osteophyte
  kind: overlay
  name: Medial meniscus/osteophyte
  summary: "The medial meniscus with its osteophytes, segmented as one structure; the lab's working reading of this label."
  base: scan
  label: { of: bone-labels, value: 5 }

- id: lateral-meniscus-osteophyte
  kind: overlay
  name: Lateral meniscus/osteophyte
  summary: "The lateral meniscus with its osteophytes, segmented as one structure; the lab's working reading of this label."
  base: scan
  label: { of: bone-labels, value: 6 }

- id: roi-iioc
  kind: overlay
  name: ROI-1 (IIOC)
  summary: "ROI-1, the IIOC: the tibia from the growth plate to the articular surface, marrow included."
  description: "the voxels measured for deck #4-6: growth plate to articular surface"
  base: tibia-grid
  shape: mask
  expect:
    - ROI-1 runs from the growth plate's proximal face to the articular surface, as
      /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (iioc) describes, checked on a
      render with the tibia plateau up, as in the deck figure.
    - "Its evidence cites qc-coronal.jpg from that iioc.py run, opened before reporting: green ROI-1 sits on the
      orange face along the plate band, on every panel, not down in the metaphysis."

- id: roi-iioc-trabecular
  kind: overlay
  name: ROI-2 (IIOC trabecular)
  summary: "ROI-2: the IIOC's trabecular core, without the subchondral plate and the cortical line by the growth plate."
  description: "the voxels measured for deck #13-15"
  base: tibia-grid
  shape: mask
  expect:
    - ROI-2 excludes the subchondral plate and the cortical line and covers the trabecular core over
      ROI-1's whole front-to-back extent, as
      /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (trabecular-roi) describes.

- id: roi-metaphyseal
  kind: overlay
  name: ROI-3 (metaphyseal)
  summary: "ROI-3: a band of trabecular bone in the marrow below the growth plate, clear of the cortex."
  description: "the voxels measured for deck #16-23"
  base: tibia-grid
  shape: mask
  expect:
    - ROI-3 is a band in the marrow below the growth plate's distal face and clear of the cortical
      wall, as /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (metaphyseal-roi)
      describes; its offset, length and clearance are the protocol's, in the record's params.

- id: roi-subchondral-plate-medial
  kind: overlay
  name: Medial subchondral plate
  summary: "The slab of subchondral bone plate measured under the middle of the medial plateau."
  description: "the voxels measured for deck #11"
  base: tibia-grid
  shape: mask
  expect: &a1
    - Each slab sits inside the subchondral plate under the articular surface, in the compartment the
      tibia-grid names medial or lateral, as
      /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (subchondral-plate) describes,
      with the render it was read from.

- id: roi-subchondral-plate-lateral
  kind: overlay
  name: Lateral subchondral plate
  summary: "The slab of subchondral bone plate measured under the middle of the lateral plateau."
  description: "the voxels measured for deck #12"
  base: tibia-grid
  shape: mask
  expect: *a1

- id: roi-cortex-100um
  kind: overlay
  name: Cortex at 100 µm
  summary: "The slab of tibial cortex measured 100 µm below the growth plate."
  description: "the voxels measured for deck #24"
  base: tibia-grid
  shape: mask
  expect: &a2
    - Measured on the `cortex` and `growth-plate-distal-face` the metaphysis step reported (the face
      is not traced again), as /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md
      (cortical) describes.

- id: roi-cortex-1000um
  kind: overlay
  name: Cortex at 1000 µm
  summary: "The slab of tibial cortex measured 1000 µm below the growth plate."
  description: "the voxels measured for deck #25"
  base: tibia-grid
  shape: mask
  expect: *a2

- id: cortex
  kind: overlay
  name: Cortex
  summary: "The tibia's cortical wall below the growth plate, where cortical thickness is measured."
  description: the cortical shell mask the cortical thickness step reads
  base: tibia-grid
  shape: mask
  expect:
    - The cortical wall only, all round, never reaching the fibula.

- id: articular-surface
  kind: overlay
  name: Articular surface
  summary: "The top surface of the tibia's articular bone, the upper limit of the IIOC."
  description: the top of the articular bone as a height field
  base: tibia-grid
  shape: surface

- id: growth-plate-proximal-face
  kind: overlay
  name: Growth plate, proximal face
  summary: "The growth plate's proximal (joint-side) face, traced across the tibia; ROI-1 starts here."
  description: traced once; the later steps read it
  base: tibia-grid
  shape: surface
  fitsPlane: { code: GP, name: the growth plate }

- id: growth-plate-distal-face
  kind: overlay
  name: Growth plate, distal face
  summary: "The growth plate's distal (shaft-side) face, traced across the tibia; ROI-3 and the cortical levels are measured below it."
  description: traced once; the later steps read it
  base: tibia-grid
  shape: surface
  fitsPlane: { code: GP, name: the growth plate }

- id: under-plate-boundary
  kind: overlay
  name: Under-plate boundary
  summary: "The lower edge of the subchondral plate, where the IIOC's trabecular core (ROI-2) begins."
  description: the lower edge of the subchondral plate
  base: tibia-grid
  shape: surface

- id: dfl-ruler
  kind: overlay
  name: DFL ruler
  summary: "The distal femoral length line, from the midpoint of the intercondylar groove's upper line (a) to the notch (b)."
  description: "from point a to the intercondylar notch point b of deck #26"
  base: scan
  shape: line
  expect:
    - Points a–d sit where /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md
      (femoral-geometry) puts them, each checked on a second view.

- id: dfw-ruler
  kind: overlay
  name: DFW ruler
  summary: "The distal femoral width line, between the outer vertices of the lateral and medial condyles (c and d)."
  description: "from point c to point d of deck #27"
  base: scan
  shape: line
  expect:
    - Points a–d sit where /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md
      (femoral-geometry) puts them, each checked on a second view.

- id: femur-frame
  kind: file
  name: Femur frame
  summary: "The femur's shaft and side-to-side axes, used to align the view to the femur."
  description:
    "femur-frame.json from femoral_frame.py: the femur's shaft and mediolateral axes; Align turns
    the view to it"
  mediaType: application/json
  expect:
    - W runs along the femur's shaft and U across the condyles, from the same femur label the
      landmarks were checked on.

- id: iioc-height-ruler
  kind: overlay
  name: IIOC height ruler
  summary: "The line IIOC height is measured along, from the middle of the growth plate to the articular bone's top."
  description: "deck #7"
  base: tibia-grid
  shape: line

- id: iioc-medial-ruler
  kind: overlay
  name: Medial IIOC height ruler
  summary: "The line the medial compartment's IIOC height is measured along."
  description: "deck #8"
  base: tibia-grid
  shape: line

- id: iioc-lateral-ruler
  kind: overlay
  name: Lateral IIOC height ruler
  summary: "The line the lateral compartment's IIOC height is measured along."
  description: "deck #9"
  base: tibia-grid
  shape: line

- id: tibial-width-ruler
  kind: overlay
  name: Tibial width ruler
  summary: "The line tibial width is measured along, on the growth plate's proximal face."
  description: "deck #10"
  base: tibia-grid
  shape: line

# Values
- id: patella-volume
  kind: value
  name: Patella volume
  summary: "Volume of the patella, counted from its segmented voxels."
  section: Segmentation
  description: patella label, thresholded voxels
  source: "deck #1"
  unit: mm3
  "on": [patella]
  selectable: true
  expect: &a3
    - Counted on the final labels (label voxels, not BV).

- id: lateral-meniscus-osteophyte-volume
  kind: value
  name: Lateral meniscus/osteophyte volume
  summary: "Volume of the lateral meniscus and its osteophytes together; the label's identity is the lab's working reading, and whether nearby fragments count is open."
  section: Segmentation
  description:
    "lateral meniscus and its spurs together, one volume per side (the lab cannot separate
    them); on OA6-1RK label 6. Open: whether label 9's pieces and tibial margin fragments 10 and 11
    count"
  source: "deck #2"
  unit: mm3
  "on": [lateral-meniscus-osteophyte]
  selectable: true
  expect: *a3

- id: medial-meniscus-osteophyte-volume
  kind: value
  name: Medial meniscus/osteophyte volume
  summary: "Volume of the medial meniscus and its osteophytes together; the label's identity is the lab's working reading, and whether nearby fragments count is open."
  section: Segmentation
  description: "medial meniscus and its spurs together, one volume per side (the lab cannot separate
    them); on OA6-1RK label 5. Open: whether label 9's pieces and tibial margin fragments 10 and 11
    count"
  source: "deck #3"
  unit: mm3
  "on": [medial-meniscus-osteophyte]
  selectable: true
  expect: *a3

- id: bone-threshold
  kind: value
  name: Bone threshold
  summary: "The density that separates bone from soft tissue in this scan's segmentation; not the threshold bone volume uses."
  section: Segmentation
  description: the HU threshold that separates bone from soft tissue in this scan's segmentation,
    chosen at intake (scan-settings); not the BV threshold, which is the lab's fixed 2.16/cm
  unit: "[hnsf'U]"
  "on": [bone-labels]
  selectable: true

- id: tv-tibial-iioc
  kind: value
  name: TV, tibial IIOC
  summary: "Total volume of the IIOC (ROI-1), from the growth plate to the articular surface."
  section: Tibial IIOC
  description: "ROI-1: growth plate to articular surface"
  source: "deck #4"
  unit: mm3
  "on": [roi-iioc]
  context: [growth-plate-proximal-face]
  selectable: true

- id: bv-tibial-iioc
  kind: value
  name: BV, tibial IIOC
  summary: "Bone volume in the IIOC (ROI-1), from the growth plate to the articular surface."
  section: Tibial IIOC
  description: ROI-1
  source: "deck #5"
  unit: mm3
  "on": [roi-iioc]
  context: [growth-plate-proximal-face]
  selectable: true

- id: bv-tv-tibial-iioc
  kind: value
  name: BV/TV, tibial IIOC
  summary: "Bone volume fraction of the IIOC (ROI-1), from the growth plate to the articular surface."
  section: Tibial IIOC
  description: ROI-1
  source: "deck #6"
  unit: "%"
  "on": [roi-iioc]
  context: [growth-plate-proximal-face]
  headline: true
  selectable: true

- id: iioc-height
  kind: value
  name: IIOC height
  summary: "Height of the IIOC, growth plate middle to articular bone top, along the shaft (or perpendicular to the growth plate: the lab hasn't decided)."
  section: Tibial IIOC
  description: middle of the growth plate to the top of the articular bone, vertical
  source: "deck #7"
  unit: mm
  "on": [iioc-height-ruler]
  context: [roi-iioc, growth-plate-proximal-face, articular-surface]
  selectable: true
  expect: &a4
    - Measured along the shaft axis (the deck value), with the perpendicular height and the
      growth-plate plane residual beside it; which the lab means is open.
    - "Its evidence cites qc-heights.jpg and qc-coronal.jpg from the iioc.py run it reports, both opened before
      reporting. On qc-heights.jpg each ruler runs from ROI-1's bottom edge to the top of the articular bone; on
      qc-coronal.jpg the orange face runs along the upper edge of the thin dark plate band on every panel, as the
      roi-iioc expect line says. A face traced below the band, in the metaphysis, makes every height and the TV too
      large, by up to twice."

- id: iioc-height-medial-compartment
  kind: value
  name: IIOC height, medial compartment
  summary: "IIOC height in the medial compartment, growth plate to articular bone top, along the shaft (or perpendicular to the growth plate: the lab hasn't decided)."
  section: Tibial IIOC
  description: "as #7, medial"
  source: "deck #8"
  unit: mm
  "on": [iioc-medial-ruler]
  context: [roi-iioc, growth-plate-proximal-face, articular-surface]
  selectable: true
  expect: *a4

- id: iioc-height-lateral-compartment
  kind: value
  name: IIOC height, lateral compartment
  summary: "IIOC height in the lateral compartment, growth plate to articular bone top, along the shaft (or perpendicular to the growth plate: the lab hasn't decided)."
  section: Tibial IIOC
  description: "as #7, lateral"
  source: "deck #9"
  unit: mm
  "on": [iioc-lateral-ruler]
  context: [roi-iioc, growth-plate-proximal-face, articular-surface]
  selectable: true
  expect: *a4

- id: tibial-width-at-the-growth-plate
  kind: value
  name: Tibial width at the growth plate
  summary: "Width of the tibia at the growth plate, from the fibula–tibia junction to the most prominent point opposite."
  section: Tibial IIOC
  description: "centre of the fibula–tibia junction on the tibial surface to the prominent point on
    the other side (open question for the lab: confirm the endpoints on one annotated scan)"
  source: "deck #10"
  unit: mm
  "on": [tibial-width-ruler]
  context: [growth-plate-proximal-face]
  selectable: true
  expect:
    - From the centre of the fibula–tibia junction on the tibial surface to the most prominent point
      on the other side, as /workflow/workflows/mouse-oa/skills/mouse-oa/examples/README.md (iioc)
      describes.

- id: subchondral-bone-plate-thickness-medial
  kind: value
  name: Subchondral bone plate thickness, medial
  summary: "Thickness of the subchondral bone plate under the middle of the medial plateau; unvalidated, as two methods differ about twofold."
  section: Subchondral plate
  description: medial plate
  source: "deck #11"
  unit: mm
  "on": [roi-subchondral-plate-medial]
  context: [articular-surface]
  selectable: true

- id: subchondral-bone-plate-thickness-lateral
  kind: value
  name: Subchondral bone plate thickness, lateral
  summary: "Thickness of the subchondral bone plate under the middle of the lateral plateau; unvalidated, as two methods differ about twofold."
  section: Subchondral plate
  description: lateral plate
  source: "deck #12"
  unit: mm
  "on": [roi-subchondral-plate-lateral]
  context: [articular-surface]
  selectable: true

- id: tv-iioc-trab
  kind: value
  name: TV, IIOC-trab
  summary: "Total volume of the IIOC's trabecular core (ROI-2), under the subchondral plate."
  section: IIOC trabecular bone
  description: "ROI-2: ROI-1 minus the subchondral plate and the cortical line next to the growth plate"
  source: "deck #13"
  unit: mm3
  "on": [roi-iioc-trabecular]
  context: [under-plate-boundary]
  selectable: true

- id: bv-iioc-trab
  kind: value
  name: BV, IIOC-trab
  summary: "Bone volume in the IIOC's trabecular core (ROI-2), under the subchondral plate."
  section: IIOC trabecular bone
  description: ROI-2
  source: "deck #14"
  unit: mm3
  "on": [roi-iioc-trabecular]
  context: [under-plate-boundary]
  selectable: true

- id: bv-tv-iioc-trab
  kind: value
  name: BV/TV, IIOC-trab
  summary: "Bone volume fraction of the trabecular bone in the IIOC (ROI-2), under the subchondral plate."
  section: IIOC trabecular bone
  description: ROI-2
  source: "deck #15"
  unit: "%"
  "on": [roi-iioc-trabecular]
  context: [under-plate-boundary]
  selectable: true

- id: metaphyseal-tv
  kind: value
  name: TV, proximal tibial trabeculae
  summary: "Total volume of ROI-3, the metaphyseal trabecular band below the growth plate."
  section: Proximal tibial trabeculae
  description: "ROI-3: a band below the growth plate, clear of cortical bone (offsets in protocol.json)"
  source: "deck #16"
  unit: mm3
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-bv
  kind: value
  name: BV, proximal tibial trabeculae
  summary: "Bone volume in ROI-3, the metaphyseal trabecular band below the growth plate."
  section: Proximal tibial trabeculae
  description: ROI-3
  source: "deck #17"
  unit: mm3
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-bv-tv
  kind: value
  name: BV/TV, proximal tibial trabeculae
  summary: "Bone volume fraction of the metaphyseal trabecular bone below the growth plate (ROI-3)."
  section: Proximal tibial trabeculae
  description: ROI-3
  source: "deck #18"
  unit: "%"
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-tb-n
  kind: value
  name: Tb.N, proximal tibial trabeculae
  summary: "Trabecular number below the growth plate (ROI-3), derived from BV/TV and Tb.Th rather than counted."
  section: Proximal tibial trabeculae
  description: ROI-3
  source: "deck #19"
  unit: 1/mm
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-tb-th
  kind: value
  name: Tb.Th, proximal tibial trabeculae
  summary: "Mean trabecular thickness below the growth plate (ROI-3), by the largest-sphere method."
  section: Proximal tibial trabeculae
  description: ROI-3, largest contained sphere
  source: "deck #20"
  unit: mm
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-tb-sp
  kind: value
  name: Tb.Sp, proximal tibial trabeculae
  summary: "Mean trabecular separation, the width of the marrow spaces, below the growth plate (ROI-3), by the largest-sphere method."
  section: Proximal tibial trabeculae
  description: ROI-3, largest contained sphere in marrow
  source: "deck #21"
  unit: mm
  "on": [roi-metaphyseal]
  context: [growth-plate-distal-face]
  selectable: true

- id: metaphyseal-tb-nd
