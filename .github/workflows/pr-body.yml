# Checks PR bodies against .github/PULL_REQUEST_TEMPLATE.md. Separate from
# ci.yml because it must also run on `edited`, so fixing the body clears the
# failure without rerunning `pnpm check`. Draft PRs are skipped.
name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - name: Check body against the template
        env:
          # Env, not inline interpolation: the body is untrusted markdown and
          # must never reach the shell as script text.
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          node tools/ci/check-pr-body.mjs --changed-files "$RUNNER_TEMP/changed-files.txt"
