# Hydra-instantiable pieces of the shipped roboflow_v100 config, with the mask loss on, flips + intensity jitter,
# and `local` loss normalisation (the shipped `global` needs a process group).
resolution: 1008
transforms:
  - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
    transforms:
      - _target_: losses.DecodeRleIgnore
      - _target_: sam3.train.transforms.basic_for_api.RandomHorizontalFlip
        consistent_transform: false
      - _target_: sam3.train.transforms.basic_for_api.ColorJitter
        consistent_transform: false
        brightness: 0.2
        contrast: 0.2
        saturation: 0.0
        hue: null
      - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
        sizes: [1008]
        max_size: 1008
        square: true
        consistent_transform: false
      - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
      - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
val_transforms:
  - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
    transforms:
      - _target_: losses.DecodeRleIgnore
      - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
        sizes: [1008]
        max_size: 1008
        square: true
        consistent_transform: false
      - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
      - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
matcher:
  _target_: sam3.train.matcher.BinaryHungarianMatcherV2
  focal: true
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  alpha: 0.25
  gamma: 2
  stable: false
loss:
  _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
  normalization: local
  matcher: ${matcher}
  o2m_weight: 2.0
  o2m_matcher:
    _target_: sam3.train.matcher.BinaryOneToManyMatcher
    alpha: 0.3
    threshold: 0.4
    topk: 4
  use_o2m_matcher_on_o2m_aux: false
  scale_by_find_batch_size: true
  loss_fns_find:
    - _target_: sam3.train.loss.loss_fns.Boxes
      weight_dict: { loss_bbox: 5.0, loss_giou: 2.0 }
    - _target_: sam3.train.loss.loss_fns.IABCEMdetr
      weak_loss: false
      weight_dict: { loss_ce: 20.0, presence_loss: 20.0 }
      pos_weight: 10.0
      alpha: 0.25
      gamma: 2
      use_presence: true
      pos_focal: false
      pad_n_queries: 200
      pad_scale_pos: 1.0
    - _target_: losses.MasksIgnore
      focal_alpha: 0.25
      focal_gamma: 2.0
      weight_dict: { loss_mask: 200.0, loss_dice: 10.0 }
      compute_aux: false
