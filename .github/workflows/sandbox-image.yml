# Builds the sandbox image (apps/runner/sandbox/Dockerfile, with workflows/microct-analysis/requirements.txt) for linux/amd64 and pushes it
# to ghcr.io/voluma-bio/voluma-sandbox. The digest it prints goes into SANDBOX_IMAGE in
# apps/runner/src/config.ts. The package must be public so a visitor's Modal workspace can pull it.
name: Sandbox image

on:
  push:
    paths:
      - apps/runner/sandbox/Dockerfile
      - workflows/microct-analysis/requirements.txt
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/runner/sandbox
          build-contexts: reqs=workflows/microct-analysis
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/voluma-bio/voluma-sandbox:${{ github.sha }}
      - run: echo "ghcr.io/voluma-bio/voluma-sandbox@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
