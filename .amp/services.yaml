# Guest-only full-stack preview. Setup installs Postgres; R2 keys come from project secrets.
services:
  review:
    platforms: [linux]
    command: WORKOS_COOKIE_PASSWORD="$(openssl rand -hex 32)" pnpm dev
    env:
      DATABASE_SERVER_URL: postgres://voluma:voluma@localhost:5432/postgres
      WORKOS_CLIENT_ID: client_local
      WORKOS_API_KEY: sk_test_local
      WORKOS_LAB_ORGANIZATION_ID: org_local
      GUEST_ORGANIZATION_ID: org_demo
    health: /health
