# The one CI check: the same `pnpm check` every agent runs locally.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/pr-assets/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/pr-assets/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      # Nx replays a task whose inputs it has seen, so a run pays only for the projects it touches.
      # The whole `.nx` goes in: the task cache alone left Nx rebuilding graph and hasher state and
      # replaying nothing. Keyed by commit because a cache entry never updates; restore-keys takes
      # the newest one.
      - uses: actions/cache@v6
        with:
          path: .nx
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-
      - run: pnpm i
      - run: pnpm check
