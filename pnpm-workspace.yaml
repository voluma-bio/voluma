packages:
  - apps/*
  - packages/*
  - workflows

# Packages whose install scripts may run. pnpm skips every other install script.
allowBuilds:
  esbuild: true
  lefthook: true
  nx: true

# One version per shared dependency; packages refer to it as "catalog:".
catalog:
  "@tanstack/react-query": 5.105.0
  lucide-react: ^1.16.0
  react-resizable-panels: 4.15.0
  "@tailwindcss/vite": ^4.3.1
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@types/three": ^0.186.0
  "@vitejs/plugin-react": ^6.0.3
  postgres: ^3.4.9
  radix-ui: 1.8.1
  react: ^19.2.7
  react-dom: ^19.2.7
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  remend: ^1.4.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.1
  three: ^0.186.1
  typescript: ^6.0.3
  vite: ^8.1.0
  vitest: ^5.0.5
  yaml: ^2.8.1
  zod: ^4.6.7
